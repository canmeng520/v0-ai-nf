# Build the self-hosted gateway image on every push to main that touches the
# API, and publish it to GHCR as :latest and :sha-<short>. The VPS updater pulls
# :latest every minute and swaps the running container without downtime.
name: image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "dev-server.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-proxy-app
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
